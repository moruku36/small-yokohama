<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Small Yokohama · スモール横浜</title>
  </head>
  <body>
    <main id="map-stage" class="map-stage" aria-label="Interactive illustrated map of Yokohama waterfront">
      <div id="osd-container" class="osd-container"></div>
      <canvas id="webgl-overlay" class="webgl-overlay" aria-hidden="true"></canvas>
      <div id="label-layer" class="label-layer" aria-hidden="true"></div>
    </main>

    <header id="bar" class="bar"></header>
    <div id="drop" class="drop" hidden></div>
    <div id="card" class="card" hidden></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="sq" class="sq"></div>
    <div id="credit" class="credit"></div>
    <div id="about-modal" class="modal-backdrop" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
