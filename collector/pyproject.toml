[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-yokohama-collector"
version = "0.1.0"
description = "Server-side GTFS-JP static schedule loader, ODPT GTFS-RT VehiclePosition collector, matcher, and Step 3 acceptance evaluator."
requires-python = ">=3.11"
dependencies = [
  "gtfs-realtime-bindings>=1.0.0",
  "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
