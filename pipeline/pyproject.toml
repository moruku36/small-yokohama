[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-yokohama-pipeline"
version = "0.1.0"
description = "Offline PLATEAU CityGML preparation, Blender orthographic rendering, DP seam cutting, and libvips DZI pyramid builder for Small Yokohama."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
vips = ["pyvips>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
